plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

javafx {
    version = "23.0.2"
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = "com.yourname.ui.FoilViewerApp"  // change to your real package/class
}   